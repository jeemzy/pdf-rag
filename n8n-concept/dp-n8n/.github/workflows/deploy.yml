name: Deploy n8n

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH }}
            
            # Pull latest changes
            git pull origin main
            
            # Ensure n8n-files directory exists with proper permissions
            mkdir -p /home/deployer/dp-n8n-dev/n8n-files
            chmod 755 /home/deployer/dp-n8n-dev/n8n-files
            
            # Pull latest images
            # Commented: pulls all services including postgres
            # docker-compose -f docker-compose.dev.yml pull
            docker-compose -f docker-compose.dev.yml pull n8n
            
            # Recreate containers (volumes are preserved)
            # NEVER use -v flag here - it would delete volumes!
            # Commented: recreates all services including postgres
            # docker-compose -f docker-compose.dev.yml up -d
            docker-compose -f docker-compose.dev.yml up -d --force-recreate --build n8n
            
            # Wait for services to be healthy
            sleep 10
            
            # Health check
            if curl -sf http://localhost:17589/healthz > /dev/null; then
              echo "Deployment successful - n8n is healthy"
            else
              echo "Warning: Health check failed, but containers may still be starting"
              docker-compose -f docker-compose.dev.yml ps
            fi

