volumes:
  dp-n8n-postgres-data-dev:
    external: true
  dp-n8n-storage-dev:
    external: true
  dp-n8n-qdrant-data-dev:
    external: true

services:
  postgres:
    image: postgres:17
    container_name: dp-postgres-dev
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_NON_ROOT_USER
      - POSTGRES_NON_ROOT_PASSWORD
      - PGPORT=27632
    volumes:
      - dp-n8n-postgres-data-dev:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    ports:
      - 27632:27632
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p 27632']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    image: dp-n8n-custom-dev
    container_name: dp-n8n-dev
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=27632
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_PORT=17589
      - N8N_SECURE_COOKIE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/.n8n-files
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_BINARY_DATA_STORAGE_PATH=/home/node/.n8n/binaryData
      - N8N_AVAILABLE_BINARY_DATA_MODES=filesystem
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - WEBHOOK_URL=${WEBHOOK_URL}
    ports:
      - 17589:17589
    volumes:
      - dp-n8n-storage-dev:/home/node/.n8n
      - /home/deployer/dp-n8n-dev/n8n-files:/home/node/.n8n-files
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dp-qdrant-dev
    restart: unless-stopped
    expose:
      - 6333
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT__SERVICE__API_KEY}
    volumes:
      - dp-n8n-qdrant-data-dev:/qdrant/storage

